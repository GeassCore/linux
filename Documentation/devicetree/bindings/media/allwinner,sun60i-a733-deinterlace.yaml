%YAML 1.2
---
$id: http://devicetree.org/schemas/media/allwinner,sun60i-a733-deinterlace.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Allwinner A733 DI301 Deinterlacer

maintainers:
  - Jernej Skrabec <jernej.skrabec@gmail.com>

description: |
  The DI301 is an offline memory-to-memory deinterlacer in the Allwinner
  A733 display subsystem. It reads interlaced YUV frames from memory and
  writes progressive YUV frames back to memory.

properties:
  compatible:
    const: allwinner,sun60i-a733-deinterlace

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    items:
      - description: Deinterlacer module clock
      - description: Deinterlacer bus clock

  clock-names:
    items:
      - const: mod
      - const: bus

  resets:
    items:
      - description: Deinterlacer bus reset
      - description: Display subsystem reset

  reset-names:
    items:
      - const: bus
      - const: sys

  iommus:
    maxItems: 1

  power-domains:
    maxItems: 1

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - clock-names
  - resets
  - reset-names
  - iommus
  - power-domains

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/sun60i-a733-ccu.h>
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/power/allwinner,sun60i-a733-pck-600.h>
    #include <dt-bindings/reset/sun60i-a733-ccu.h>

    deinterlace@5400000 {
        compatible = "allwinner,sun60i-a733-deinterlace";
        reg = <0x05400000 0x40000>;
        interrupts = <GIC_SPI 52 IRQ_TYPE_LEVEL_HIGH>;
        clocks = <&ccu CLK_DI>, <&ccu CLK_DI_GATE>;
        clock-names = "mod", "bus";
        resets = <&ccu RST_BUS_DI>, <&ccu RST_BUS_DE_SY>;
        reset-names = "bus", "sys";
        iommus = <&iommu 9 1>;
        power-domains = <&pck600 PD_DE_SYS>;
    };
...
