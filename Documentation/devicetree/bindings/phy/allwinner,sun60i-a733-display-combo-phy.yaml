%YAML 1.2
---
$id: http://devicetree.org/schemas/phy/allwinner,sun60i-a733-display-combo-phy.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Allwinner A733 Display Combo-PHY

maintainers:
  - Chen-Yu Tsai <wens@csie.org>

description:
  The A733 display Combo-PHY contains the analog transmitter and dedicated
  display PLL shared by an LVDS output and a MIPI DSI host. Each instance
  has its own register window, bus clock and reset line.

properties:
  compatible:
    const: allwinner,sun60i-a733-display-combo-phy

  reg:
    maxItems: 1

  clocks:
    items:
      - description: Combo-PHY bus clock
      - description: 24 MHz reference clock for the display PLL

  clock-names:
    items:
      - const: bus
      - const: ref

  resets:
    maxItems: 1

  "#phy-cells":
    const: 0

required:
  - compatible
  - reg
  - clocks
  - clock-names
  - resets
  - "#phy-cells"

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/sun60i-a733-ccu.h>
    #include <dt-bindings/reset/sun60i-a733-ccu.h>

    phy@5507000 {
        compatible = "allwinner,sun60i-a733-display-combo-phy";
        reg = <0x05507000 0x200>;
        clocks = <&ccu CLK_BUS_DSI0>, <&dcxo24M>;
        clock-names = "bus", "ref";
        resets = <&ccu RST_BUS_DSI0>;
        #phy-cells = <0>;
    };
...
